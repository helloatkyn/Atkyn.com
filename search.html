<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Atkyn</title>
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <!-- Phosphor Icons (used only in the plus menu sheet) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-light.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css" media="(prefers-color-scheme: dark)">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

  <link rel="stylesheet" href="search.css/search.css">
  <link rel="stylesheet" href="search.css/code-block.css">
  <link rel="stylesheet" href="search.css/stock-card.css">
  <link rel="stylesheet" href="search.css/chat.css">
  <link rel="stylesheet" href="search.css/chatbar.css">
</head>
<body>

  <div class="scroll-host" id="scrollHost">

    <div class="logo-header">
      <img src="Atkyn.svg" alt="Atkyn" />

      <div class="header-right">
        <button class="pencil-btn" id="newChatBtn" aria-label="New chat">
          <i class="ti ti-edit"></i>
        </button>
        <button class="hamburger-btn" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>

    <div class="tab-bar" id="tabBar">
      <button class="tab active" data-tab="ai">Answer</button>
      <button class="tab" data-tab="web">Web</button>
      <button class="tab" data-tab="images">Images</button>
      <button class="tab" data-tab="videos">Videos</button>
      <button class="tab" data-tab="news">News</button>
      <button class="tab" data-tab="maps">Maps</button>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="msg-wrap" id="msgWrap"></div>
      <div id="chatSpacer"></div>
    </div>

    <div id="pageContent" style="display:none"></div>

  </div>

  <div class="plus-menu-backdrop" id="plusBackdrop"></div>

  <div class="plus-menu" id="plusMenu">

    <button class="pm-item" id="pmPhoto">
      <span class="pm-icon">
        <i class="ph ph-image"></i>
      </span>
      <span class="pm-label">
        <span class="pm-label-title">Photo Library</span>
        <span class="pm-label-sub">Choose from gallery</span>
      </span>
    </button>

    <button class="pm-item" id="pmCamera">
      <span class="pm-icon">
        <i class="ph ph-camera"></i>
      </span>
      <span class="pm-label">
        <span class="pm-label-title">Camera</span>
        <span class="pm-label-sub">Take a photo</span>
      </span>
    </button>

    <button class="pm-item" id="pmFile">
      <span class="pm-icon">
        <i class="ph ph-file-text"></i>
      </span>
      <span class="pm-label">
        <span class="pm-label-title">Upload File</span>
        <span class="pm-label-sub">PDF, text, code, image</span>
      </span>
    </button>

    <button class="pm-item" id="pmLocation">
      <span class="pm-icon">
        <i class="ph ph-map-pin"></i>
      </span>
      <span class="pm-label">
        <span class="pm-label-title">Location</span>
        <span class="pm-label-sub">Share your location</span>
      </span>
    </button>

  </div>

  <div class="chatbar-wrap">
    <div class="overlay-pill" id="pill">

      <div class="attach-tray" id="attachTray">
        <div class="attach-tray-inner">
          <div class="attach-list" id="attachList" role="list" aria-label="Attachments"></div>
          <div class="attach-notice" id="attachNotice" role="status" aria-live="polite" hidden></div>
        </div>
      </div>

      <button class="ico-plus" id="plusBtn" aria-label="Add">
        <svg viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>

      <div class="overlay-input-wrap">
        <input
          class="search-input"
          type="search"
          id="cbInput"
          placeholder=" "
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="search"
        />
        <div class="shimmer-overlay">
          <span>Ask Atkyn Anything</span>
        </div>
      </div>

      <button class="ico-wave" aria-label="Voice search">
        <svg viewBox="0 0 24 24">
          <line x1="2"  y1="12" x2="2"  y2="12"/>
          <line x1="5"  y1="8"  x2="5"  y2="16"/>
          <line x1="8"  y1="5"  x2="8"  y2="19"/>
          <line x1="11" y1="8"  x2="11" y2="16"/>
          <line x1="14" y1="4"  x2="14" y2="20"/>
          <line x1="17" y1="8"  x2="17" y2="16"/>
          <line x1="20" y1="5"  x2="20" y2="19"/>
          <line x1="23" y1="8"  x2="23" y2="16"/>
        </svg>
      </button>

      <button class="send-btn" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24">
          <line x1="12" y1="20" x2="12" y2="4"/>
          <polyline points="5 11 12 4 19 11"/>
        </svg>
      </button>

    </div>

    <input type="file" id="fileInputPhoto"  accept="image/*" multiple hidden tabindex="-1">
    <input type="file" id="fileInputCamera" accept="image/*" capture="environment" hidden tabindex="-1">
    <input type="file" id="fileInputFile"   multiple hidden tabindex="-1"
           accept="image/*,application/pdf,.pdf,text/*,.txt,.md,.markdown,.csv,.tsv,.json,.xml,.yaml,.yml,.html,.css,.js,.mjs,.ts,.jsx,.tsx,.py,.java,.c,.cpp,.h,.cs,.go,.rs,.rb,.php,.sh,.sql,.kt,.swift,.dart,.log,.ini,.toml">
  </div>

  <script src="renderer.js"></script>
  <script src="core.js"></script>
  <script src="attachment.js"></script>
  <script src="animation.js" defer></script>
  <script src="search.js"></script>

</body>
</html>
