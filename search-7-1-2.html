<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Atkyn</title>
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; overflow: hidden; }

    body {
      position: fixed; inset: 0;
      overscroll-behavior: none;
      background: #fff;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1c1e; color: #f0f0f2; }
    }

    /* ── scroll host ── */
    .scroll-host {
      flex: 1; min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: none;
      scroll-behavior: auto;
    }
    .scroll-host::-webkit-scrollbar { display: none; }

    /* ── logo header ── */
    .logo-header {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      padding: 16px 18px 10px;
      height: 76px;
      overflow: hidden;
      opacity: 1;
      transition: height 0.18s cubic-bezier(0.4,0,0.2,1),
                  padding 0.18s cubic-bezier(0.4,0,0.2,1),
                  opacity 0.15s ease;
    }
    .logo-header img {
      height: 48px; width: auto; object-fit: contain;
    }
    .logo-header.collapsed {
      height: 0; padding-top: 0; padding-bottom: 0;
      opacity: 0; pointer-events: none;
    }

    /* ── hamburger ── */
    .hamburger-btn {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      border: none; background: none; cursor: pointer;
      display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 5.5px;
      width: 40px; height: 40px; padding: 8px;
      border-radius: 10px;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .hamburger-btn span { display: block; height: 1.5px; border-radius: 99px; background: #1a1a1a; }
    .hamburger-btn span:nth-child(1) { width: 22px; }
    .hamburger-btn span:nth-child(2) { width: 15px; }
    .hamburger-btn span:nth-child(3) { width: 22px; }
    .hamburger-btn:active { background: rgba(0,0,0,0.06); }
    @media (prefers-color-scheme: dark) {
      .hamburger-btn span { background: #e5e5e7; }
    }

    /* ── nine-dot grid (left) ── */
    .dots-btn {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      border: none; background: none; cursor: pointer;
      display: grid; grid-template-columns: repeat(3, 4px); gap: 4px;
      align-content: center; justify-content: center;
      width: 40px; height: 40px;
      border-radius: 12px;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .dots-btn span {
      display: block; width: 4px; height: 4px;
      border-radius: 50%; background: #1a1a1a;
      transition: background 0.2s;
    }
    .dots-btn:active { background: rgba(0,0,0,0.06); }
    .dots-btn:active span { background: #F34655; }
    @media (prefers-color-scheme: dark) {
      .dots-btn span { background: #e5e5e7; }
    }

    /* ── tab bar ── */
    .tab-bar {
      flex-shrink: 0;
      display: flex; align-items: center;
      overflow-x: auto; overflow-y: hidden;
      padding: 0 14px;
      gap: 0;
      height: 38px;
      border-bottom: 1px solid rgba(0,0,0,0.09);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      position: sticky; top: 0; z-index: 20;
      background: rgba(255,255,255,0.95);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
    }
    .tab-bar.hide  { transform: translateY(-100%) translateZ(0); }
    .tab-bar.scrolled { box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
    .tab-bar::-webkit-scrollbar { display: none; }
    @media (prefers-color-scheme: dark) {
      .tab-bar { border-bottom-color: rgba(255,255,255,0.08); background: rgba(28,28,30,0.95); }
      .tab-bar.scrolled { box-shadow: 0 1px 6px rgba(0,0,0,0.3); }
    }

    .tab {
      flex-shrink: 0;
      padding: 6px 16px;
      font-size: 0.875rem;
      font-weight: 500;
      color: #888;
      cursor: pointer;
      letter-spacing: 0.01em;
      white-space: nowrap;
      border: none; background: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    @media (prefers-color-scheme: dark) { .tab { color: #8e8e93; } }
    .tab.active { color: #1a1a1a; font-weight: 700; }
    @media (prefers-color-scheme: dark) { .tab.active { color: #f0f0f2; } }

    /* ── chat area ── */
    .chat-area {
      padding: 14px 16px 0;
      display: flex; flex-direction: column;
    }

    #chatSpacer { flex-shrink: 0; width: 100%; }

    .msg-wrap {
      display: flex; flex-direction: column;
      gap: 6px;
      contain: layout;
    }

    .msg { display: flex; flex-direction: column; }
    .msg.user { align-items: flex-end; }
    .msg.bot  { align-items: flex-start; }

    /* ── user bubble ── */
    .msg.user .bubble {
      max-width: 78%;
      background: #efefef;
      color: #1a1a1a;
      padding: 9px 14px;
      border-radius: 18px;
      border-bottom-right-radius: 4px;
      font-size: 0.97rem;
      line-height: 1.45;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      animation: bubbleIn 0.18s cubic-bezier(0.25,0.46,0.45,0.94) both;
    }
    @media (prefers-color-scheme: dark) {
      .msg.user .bubble { background: #2c2c2e; color: #f0f0f2; }
    }

    /* ── bot bubble ── */
    .msg.bot .bubble {
      max-width: 96%;
      background: none;
      border: none;
      padding: 1px 2px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-style: normal;
      font-size: 1.01rem;
      line-height: 1.65;
      color: #1a1a1a;
      animation: botIn 0.18s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @media (prefers-color-scheme: dark) {
      .msg.bot .bubble { color: #d4d4d6; }
    }

    /* ── bot bubble typography ── */
    .msg.bot .bubble p { margin: 0 0 10px; }
    .msg.bot .bubble p:last-child { margin-bottom: 0; }

    .msg.bot .bubble h3 {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 1.05rem; font-weight: 700;
      margin: 14px 0 5px; color: #1a1a1a;
      letter-spacing: -0.01em;
    }
    .msg.bot .bubble h4 {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.98rem; font-weight: 650;
      margin: 12px 0 4px; color: #1a1a1a;
    }
    .msg.bot .bubble h5 {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.93rem; font-weight: 600;
      margin: 10px 0 3px; color: #555;
    }
    @media (prefers-color-scheme: dark) {
      .msg.bot .bubble h3,
      .msg.bot .bubble h4 { color: #f0f0f2; }
      .msg.bot .bubble h5 { color: #aaa; }
    }

    .msg.bot .bubble ul,
    .msg.bot .bubble ol { padding-left: 20px; margin: 0 0 10px; }
    .msg.bot .bubble li { margin-bottom: 5px; line-height: 1.55; }

    .msg.bot .bubble strong { font-weight: 650; }
    .msg.bot .bubble em { font-style: italic; }

    .msg.bot .bubble code {
      font-family: 'SFMono-Regular', 'SF Mono', 'Menlo', 'Consolas', 'Liberation Mono', monospace;
      font-size: 0.84em;
      background: rgba(95,99,255,0.07);
      color: #444;
      padding: 2px 6px; border-radius: 5px;
      border: 1px solid rgba(0,0,0,0.07);
    }
    @media (prefers-color-scheme: dark) {
      .msg.bot .bubble code {
        background: rgba(255,255,255,0.09);
        border-color: rgba(255,255,255,0.08);
        color: #c9d1d9;
      }
    }

    /* pre/code inside .msg.bot .bubble — fallback only (main styles in .code-block) */
    .msg.bot .bubble > pre {
      background: #f6f8fa;
      border-radius: 10px;
      padding: 14px 16px;
      margin: 8px 0 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .msg.bot .bubble > pre code {
      background: none; padding: 0;
      font-size: 0.84rem; line-height: 1.65;
      color: #1a1a1a;
      font-family: 'SFMono-Regular', 'SF Mono', 'Menlo', 'Consolas', monospace;
      border-radius: 0;
    }
    @media (prefers-color-scheme: dark) {
      .msg.bot .bubble > pre { background: #1e1e1e; }
      .msg.bot .bubble > pre code { color: #cdd9e5; }
    }

    /* ── table scroll wrapper — borderless Gemini-style ── */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 10px 0 14px;
    }
    .table-wrap::-webkit-scrollbar { display: none; }

    /* ── table ── */
    .msg.bot .bubble table {
      width: 100%;
      border-collapse: collapse;
      margin: 0;
      font-size: 0.92rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-width: 280px;
    }
    .msg.bot .bubble th {
      padding: 10px 16px 10px 0;
      text-align: left;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
      color: #1a1a1a;
      border-bottom: 1.5px solid rgba(0,0,0,0.12);
      white-space: normal;
      vertical-align: bottom;
      line-height: 1.35;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .msg.bot .bubble th:first-child { padding-left: 0; }
    .msg.bot .bubble th:last-child  { padding-right: 0; padding-left: 0; }
    .msg.bot .bubble td {
      padding: 12px 16px 12px 0;
      text-align: left;
      border-bottom: 1px solid rgba(0,0,0,0.09);
      vertical-align: top;
      line-height: 1.55;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .msg.bot .bubble td:first-child { padding-left: 0; }
    .msg.bot .bubble td:last-child  { padding-right: 0; padding-left: 0; }
    .msg.bot .bubble tr:last-child td { border-bottom: none; }
    @media (prefers-color-scheme: dark) {
      .msg.bot .bubble th {
        color: #f0f0f2;
        border-bottom-color: rgba(255,255,255,0.15);
      }
      .msg.bot .bubble td {
        color: #d4d4d6;
        border-bottom-color: rgba(255,255,255,0.08);
      }
    }

    /* ── code block — light grey style ── */
    .code-block {
      margin: 10px 0 16px;
      border-radius: 10px;
      overflow: hidden;
      background: #f8f8f8;
      border: 1px solid rgba(0,0,0,0.08);
    }
    @media (prefers-color-scheme: dark) {
      .code-block { background: #242428; border-color: rgba(255,255,255,0.07); }
    }
    .code-block-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 14px;
      background: rgba(0,0,0,0.04);
      border-bottom: 1px solid rgba(0,0,0,0.07);
      user-select: none;
    }
    @media (prefers-color-scheme: dark) {
      .code-block-header {
        background: rgba(255,255,255,0.04);
        border-bottom-color: rgba(255,255,255,0.06);
      }
    }
    .code-block-lang {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: lowercase;
      color: #888;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    @media (prefers-color-scheme: dark) { .code-block-lang { color: #666; } }
    .code-copy-btn {
      display: flex; align-items: center; gap: 5px;
      border: none; background: none; cursor: pointer;
      color: #888;
      padding: 3px 8px; border-radius: 5px;
      font-size: 0.73rem; font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: background 0.13s, color 0.13s;
      -webkit-tap-highlight-color: transparent;
    }
    .code-copy-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
    .code-copy-btn:active { background: rgba(0,0,0,0.06); color: #555; }
    .code-copy-btn.copied { color: #2da44e; }
    @media (prefers-color-scheme: dark) {
      .code-copy-btn { color: #666; }
      .code-copy-btn:active { background: rgba(255,255,255,0.08); color: #aaa; }
      .code-copy-btn.copied { color: #4ec994; }
    }
    .code-block pre {
      margin: 0;
      padding: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      background: transparent;
    }
    .code-block pre::-webkit-scrollbar { height: 4px; }
    .code-block pre::-webkit-scrollbar-track { background: transparent; }
    .code-block pre::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 99px; }
    @media (prefers-color-scheme: dark) {
      .code-block pre::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); }
    }
    .code-block .code-lines {
      display: table;
      min-width: 100%;
      padding: 12px 0;
    }
    .code-line { display: table-row; }
    .code-line:nth-child(even) .code-line-content {
      background: rgba(0,0,0,0.025);
    }
    @media (prefers-color-scheme: dark) {
      .code-line:nth-child(even) .code-line-content { background: rgba(255,255,255,0.025); }
    }
    .code-line-num {
      display: table-cell;
      padding: 0 14px 0 16px;
      text-align: right;
      font-size: 0.8rem;
      line-height: 1.7;
      color: rgba(0,0,0,0.2);
      font-family: 'SFMono-Regular','SF Mono','Menlo','Consolas',monospace;
      user-select: none;
      white-space: nowrap;
      min-width: 36px;
    }
    @media (prefers-color-scheme: dark) { .code-line-num { color: rgba(255,255,255,0.2); } }
    .code-line-content {
      display: table-cell;
      padding: 0 18px 0 4px;
      font-size: 0.83rem;
      line-height: 1.7;
      white-space: pre;
      font-family: 'SFMono-Regular','SF Mono','Menlo','Consolas',monospace;
      color: #1a1a1a;
      width: 100%;
    }
    @media (prefers-color-scheme: dark) { .code-line-content { color: #cdd9e5; } }
    /* ── syntax token colors — light mode ── */
    .tk-kw   { color: #7b22c7; }
    .tk-fn   { color: #0066cc; }
    .tk-str  { color: #1a7a3c; }
    .tk-num  { color: #b85c00; }
    .tk-cmt  { color: #909090; font-style: italic; }
    .tk-cls  { color: #b06c00; }
    .tk-prop { color: #c0392b; }
    .tk-bool { color: #b85c00; }
    /* dark mode token overrides */
    @media (prefers-color-scheme: dark) {
      .tk-kw   { color: #c678dd; }
      .tk-fn   { color: #61afef; }
      .tk-str  { color: #98c379; }
      .tk-num  { color: #d19a66; }
      .tk-cmt  { color: #5c6370; }
      .tk-cls  { color: #e5c07b; }
      .tk-prop { color: #e06c75; }
      .tk-bool { color: #d19a66; }
    }
    /* ── fallback pre>code ── */
    .code-block pre code {
      display: block;
      padding: 14px 16px;
      background: none;
      color: #1a1a1a;
      font-size: 0.83rem; line-height: 1.7;
      font-family: 'SFMono-Regular','SF Mono','Menlo','Consolas',monospace;
    }
    @media (prefers-color-scheme: dark) {
      .code-block pre code { color: #cdd9e5; }
    }

    /* ── entrance animations ── */
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0);   }
    }
    @keyframes botIn {
      from { transform: translateY(5px); }
      to   { transform: translateY(0);   }
    }

    /* ── typing dots ── */
    .typing {
      position: relative;
      width: 54px; height: 40px;
      padding: 0; margin: 2px 0;
    }
    .typing span {
      position: absolute;
      border-radius: 50%;
      background: #F34655;
      animation: tPulse 1.4s ease-in-out infinite;
    }
    .typing span:nth-child(1) { width: 16px; height: 16px; left: 0px;  top: 6px;  animation-delay: 0s;    }
    .typing span:nth-child(2) { width: 11px; height: 11px; left: 20px; top: 22px; animation-delay: 0.2s;  }
    .typing span:nth-child(3) { width: 8px;  height: 8px;  left: 34px; top: 10px; animation-delay: 0.35s; }
    .typing span:nth-child(4) { width: 6px;  height: 6px;  left: 46px; top: 13px; animation-delay: 0.5s;  }
    @keyframes tPulse {
      0%, 100% { transform: scale(1);    opacity: 0.55; }
      45%       { transform: scale(1.35); opacity: 1;    }
    }

    /* ── bot action bar ── */
    .bot-actions {
      display: flex; align-items: center;
      gap: 1px; padding: 3px 0 0;
      opacity: 0; transform: translateY(4px);
      animation: fadeUp 0.22s ease 0.1s forwards;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .bot-actions button {
      display: flex; align-items: center; justify-content: center;
      width: 35px; height: 35px;
      border: none; background: none; cursor: pointer;
      border-radius: 8px; color: #999;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.13s, color 0.13s; padding: 0;
    }
    .bot-actions button:active { background: rgba(0,0,0,0.07); color: #444; }
    .bot-actions button svg { width: 19px; height: 19px; stroke-width: 1.65; }
    .bot-actions button[aria-label="Read"] svg { width: 22px; height: 22px; }
    .bot-actions button.active-like    { color: #2da44e; }
    .bot-actions button.active-dislike { color: #F34655; }
    @media (prefers-color-scheme: dark) {
      .bot-actions button { color: #8e8e93; }
      .bot-actions button:active { background: rgba(255,255,255,0.09); color: #aaa; }
      .bot-actions button.active-like    { color: #3fb950; }
      .bot-actions button.active-dislike { color: #F34655; }
    }

    /* ── chatbar ── */
    .chatbar-wrap {
      flex-shrink: 0;
      padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
      background: #fff;
      position: relative; z-index: 10;
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    @media (prefers-color-scheme: dark) {
      .chatbar-wrap { background: #1c1c1e; }
    }

    .overlay-pill {
      width: 100%; display: flex; align-items: center;
      background: #fff;
      border: 2px solid #F34655; border-radius: 100px;
      padding: 0 18px 0 20px; height: 66px; gap: 12px;
      flex-shrink: 0;
      transition: border-color 0.18s;
    }
    .overlay-pill:focus-within { border-color: #e02235; }
    @media (prefers-color-scheme: dark) {
      .overlay-pill { background: #2c2c2e; border-color: #F34655; }
    }

    .ico-plus {
      flex-shrink: 0; color: #F34655;
      display: flex; align-items: center;
      border: none; background: none; cursor: pointer;
      padding: 4px; border-radius: 50%; transition: background 0.12s;
    }
    .ico-plus:active { background: rgba(243,70,85,0.10); }
    .ico-plus svg { width: 24px; height: 24px; }

    .overlay-input-wrap { flex: 1; position: relative; height: 100%; display: flex; align-items: center; }

    .search-input {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: none; outline: none; background: transparent;
      font-size: 1.08rem; font-weight: 400;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #1a1a1a; padding: 0; z-index: 2;
      caret-color: #F34655; letter-spacing: 0.01em;
    }
    .search-input::placeholder { color: transparent; }
    @media (prefers-color-scheme: dark) { .search-input { color: #e5e5e7; } }

    .shimmer-overlay {
      position: absolute; inset: 0; display: flex; align-items: center;
      pointer-events: none; z-index: 1; overflow: hidden;
    }
    .shimmer-overlay span {
      font-size: 1.08rem; white-space: nowrap; letter-spacing: 0.01em;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(90deg,
        #b0bec5 0%, #b0bec5 25%,
        #F34655 48%, #F34655 52%,
        #b0bec5 75%, #b0bec5 100%);
      background-size: 300% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: sweep 3.5s 1s linear infinite;
    }
    @keyframes sweep {
      0%   { background-position: 150% center; }
      100% { background-position: -150% center; }
    }
    .search-input:not(:placeholder-shown) + .shimmer-overlay { display: none; }

    .ico-camera {
      flex-shrink: 0; border: none; background: none; cursor: pointer;
      color: #F34655; display: flex; align-items: center;
      padding: 4px; border-radius: 50%; transition: background 0.12s;
    }
    .ico-camera:active { background: rgba(243,70,85,0.10); }
    .ico-camera svg { width: 24px; height: 24px; }

    .send-btn {
      flex-shrink: 0; display: none;
      align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 50%;
      border: none; background: #F34655; cursor: pointer;
      transition: transform 0.15s ease;
    }
    .send-btn:active { transform: scale(0.88); }
    .send-btn svg { width: 17px; height: 17px; }
    .overlay-pill.has-text .ico-camera { display: none; }
    .overlay-pill.has-text .send-btn   { display: flex; }

    /* ── plus menu ── */
    .plus-menu-backdrop {
      position: fixed; inset: 0;
      z-index: 100; display: none;
    }
    .plus-menu-backdrop.open { display: block; }

    .plus-menu {
      position: fixed; left: 16px; width: 220px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 0 0 0.5px rgba(0,0,0,0.08), 0 8px 32px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.06);
      overflow: hidden; z-index: 101;
      transform: translateY(10px) scale(0.96);
      transform-origin: bottom left;
      opacity: 0; pointer-events: none;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.18s ease;
    }
    .plus-menu.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: all; }
    @media (prefers-color-scheme: dark) {
      .plus-menu {
        background: #2c2c2e;
        box-shadow: 0 0 0 0.5px rgba(255,255,255,0.07), 0 8px 32px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.3);
      }
    }

    .pm-item {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 16px; cursor: pointer;
      border: none; background: none; width: 100%; text-align: left;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.94rem; font-weight: 450; letter-spacing: 0.01em;

    .pm-item:active { background: rgba(0,0,0,0.05); }
    .pm-item + .pm-item::before {
      content: ''; position: absolute; top: 0; left: 46px; right: 0;
      height: 0.5px; background: rgba(0,0,0,0.08);
    }
    @media (prefers-color-scheme: dark) {
      .pm-item { color: #f0f0f2; }
      .pm-item:active { background: rgba(255,255,255,0.07); }
      .pm-item + .pm-item::before { background: rgba(255,255,255,0.07); }

    .pm-icon {
      flex-shrink: 0; width: 30px; height: 30px;
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
    }
    .pm-icon svg { width: 16px; height: 16px; }
    .pm-icon-photo    { background: #ff9f0a; }
    .pm-icon-camera   { background: #F34655; }
    .pm-icon-file     { background: #0071e3; }
    .pm-icon-location { background: #34c759; }
  </style>
</head>
<body>
  <div class="scroll-host" id="scrollHost">
    <div class="logo-header">
      <button class="dots-btn" aria-label="Options">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>

      <button class="tab" data-tab="web">Web</button>
      <button class="tab" data-tab="images">Images</button>
      <button class="tab" data-tab="videos">Videos</button>
      <button class="tab" data-tab="news">News</button>
      <button class="tab" data-tab="maps">Maps</button>
    </div>
    <div class="chat-area" id="chatArea">
      <div class="msg-wrap" id="msgWrap"></div>
      <div id="chatSpacer"></div>
    </div>
  </div>

  <div class="plus-menu-backdrop" id="plusBackdrop"></div>

  <div class="plus-menu" id="plusMenu">
    <button class="pm-item" id="pmPhoto">
      <span class="pm-icon pm-icon-photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>

      Photo Library
    </button>
    <button class="pm-item" id="pmCamera">
      <span class="pm-icon pm-icon-camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>

    </button>
    <button class="pm-item" id="pmFile">
      <span class="pm-icon pm-icon-file">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>

    </button>

      <span class="pm-icon pm-icon-location">

          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>

    </button>
  </div>

  <div class="chatbar-wrap">
    <div class="overlay-pill" id="pill">
      <button class="ico-plus" id="plusBtn" aria-label="Add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
      <div class="overlay-input-wrap">
        <input class="search-input" type="text" id="cbInput" placeholder=" "
          autocomplete="off" enterkeyhint="search" />
        <div class="shimmer-overlay"><span>Ask Atkyn</span></div>
      </div>
      <button class="ico-camera" aria-label="Visual search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
      <button class="send-btn" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="20" x2="12" y2="4"/>
          <polyline points="5 11 12 4 19 11"/>
        </svg>
      </button>
    </div>
  </div>

<script>
  const input      = document.getElementById('cbInput');
  const sendBtn    = document.getElementById('sendBtn');
  const pill       = document.getElementById('pill');
  const msgWrap    = document.getElementById('msgWrap');
  const scrollHost = document.getElementById('scrollHost');
  const logoHeader = document.querySelector('.logo-header');
  const tabBar     = document.getElementById('tabBar');

  /* ── Shared state ── */
  let viewportResizing    = false;
  let rafPending          = false;
  let lastScrollY         = 0;
  let accumDown           = 0;
  let accumUp             = 0;
  let _keyboardOpen       = false;
  let isLogoCollapsed     = false;
  let isTabHidden         = false;
  let isTabScrolled       = false;
  let _scrollRafId        = null;
  let _programmaticScroll = false;
  let _lastUserMsgEl      = null;
  let _pinnedToBottom     = true;

  /* ── scrollToMsg ── */
  function scrollToMsg(el) {
    if (!el) return;
    if (_scrollRafId !== null) cancelAnimationFrame(_scrollRafId);
    _scrollRafId = requestAnimationFrame(() => {
      _scrollRafId = requestAnimationFrame(() => {
        _scrollRafId = null;
        _programmaticScroll = true;
        const tabH   = tabBar.offsetHeight;
        const GAP    = 8;
        const target = Math.max(0, el.offsetTop - tabH - GAP);
        scrollHost.scrollTop = target;
        lastScrollY = scrollHost.scrollTop;
        accumDown = 0; accumUp = 0;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => { _programmaticScroll = false; });
        });
      });
    });
  }

  pill.addEventListener('pointerdown', (e) => {
    if (e.target !== pill && e.target !== input &&
        e.target.closest('button, .overlay-input-wrap')) return;
    if (document.activeElement === input || _keyboardOpen) return;
    e.preventDefault();
    requestAnimationFrame(() => { input.focus(); });
  }, { passive: false });

  input.addEventListener('input', () => {
    pill.classList.toggle('has-text', input.value.trim().length > 0);
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', send);

  /* ── abort controller ── */
  let streamAbort = null;

  /* ── conversation history: 100 turns ── */
  const MAX_HISTORY = 100;
  const _history = [];

  async function send() {
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    pill.classList.remove('has-text');
    addMsg('user', q);
    showTyping();

    _history.push({ role: 'user', content: q });
    if (_history.length > MAX_HISTORY) _history.splice(0, _history.length - MAX_HISTORY);

    if (streamAbort) { streamAbort.abort(); streamAbort = null; }
    streamAbort = new AbortController();

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: q, history: _history.slice(0, -1) }),
        signal: streamAbort.signal,
      });

      if (!resp.ok) {
        removeTyping();
        addMsg('bot', 'Something went wrong. Please try again.');
        streamAbort = null;
        return;
      }

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder('utf-8', { fatal: false });
      let sseBuffer = '';
      let fullText  = '';

      outer: while (true) {
        const { done, value } = await reader.read();
        sseBuffer += done ? decoder.decode() : decoder.decode(value, { stream: true });
        if (done) break;
        const lines = sseBuffer.split('\n');
        sseBuffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') break outer;
          try {
            const json  = JSON.parse(data);
            const delta = json.choices?.[0]?.delta?.content || '';
            if (delta) fullText += delta;
          } catch (_) {}
        }
      }

      streamAbort = null;

      if (fullText) {
        _history.push({ role: 'assistant', content: fullText });
        if (_history.length > MAX_HISTORY) _history.splice(0, _history.length - MAX_HISTORY);
      }

      requestAnimationFrame(() => {
        removeTyping();
        if (fullText) {
          const botEl    = document.createElement('div');
          botEl.className = 'msg bot';
          const bubbleEl = document.createElement('div');
          bubbleEl.className = 'bubble';
          bubbleEl.innerHTML = renderMarkdown(fullText);
          botEl.appendChild(bubbleEl);
          msgWrap.appendChild(botEl);
          appendBotActions(botEl, fullText);
        }
      });

    } catch (err) {
      if (err.name === 'AbortError') return;
      removeTyping();
      addMsg('bot', 'Network error. Please try again.');
      streamAbort = null;
    }
  }

  /* ── markdown renderer ── */
  function inlineFormat(text) {
    return text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/`([^`]+)`/g,          '<code>$1</code>')
      .replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*\n]+?)\*/g,     '<em>$1</em>');
  }

  function renderMarkdown(text) {
    /* Strip raw artifacts the model may emit */
    text = text
      .replace(/^-{3,}\s*$/gm, '')      // --- separators
      .replace(/^\*{2}\s*$/gm, '')       // standalone **
      .replace(/^#{4,6}\s+/gm, '### '); // #### and deeper → ###

    /* Fenced code blocks — extract before splitting on \n\n */
    const codeBlocks = [];
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      const idx = codeBlocks.length;
      codeBlocks.push({ lang: lang.trim(), code: code.trimEnd() });
      return `\x00CODE${idx}\x00`;
    });

    const html = text
      .split('\n\n')
      .map(block => {
        const t = block.trim();
        if (!t) return '';

        /* code block placeholder */
        const cm = t.match(/^\x00CODE(\d+)\x00$/);
        if (cm) {
          const { lang, code } = codeBlocks[+cm[1]];
          const langLabel = lang ? lang.toLowerCase() : 'code';
          const highlighted = syntaxHighlight(code, lang);
          const blockId = 'cb' + Math.random().toString(36).slice(2,8);
          return `<div class="code-block" id="${blockId}"><div class="code-block-header"><span class="code-block-lang">${langLabel}</span><button class="code-copy-btn" data-target="${blockId}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</button></div><pre>${highlighted}</pre></div>`;
        }

        /* headings */
        const hm = t.match(/^(#{1,3}) (.+)/);
        if (hm) {
          const tag = 'h' + (hm[1].length + 2); // h3 / h4 / h5
          return `<${tag}>${inlineFormat(hm[2])}</${tag}>`;
        }

        /* markdown table */
        if (/^\|.+\|/m.test(t)) {
          const rows = t.split('\n').filter(r => r.trim() && !/^[\s|:-]+$/.test(r));
          if (rows.length >= 1) {
            const parseRow = r => r.replace(/^\||\|$/g, '').split('|')
              .map(c => inlineFormat(c.trim()));
            const [header, ...body] = rows;
            const hCells = parseRow(header).map(c => `<th>${c}</th>`).join('');
            const bRows  = body.map(r =>
              `<tr>${parseRow(r).map(c => `<td>${c}</td>`).join('')}</tr>`
            ).join('');
            return `<div class="table-wrap"><table><thead><tr>${hCells}</tr></thead><tbody>${bRows}</tbody></table></div>`;
          }
        }

        /* unordered list */
        if (/^[-*•] /m.test(t)) {
          const items = t.split('\n').filter(Boolean)
            .map(l => `<li>${inlineFormat(l.replace(/^[-*•] /, ''))}</li>`)
            .join('');
          return `<ul>${items}</ul>`;
        }

        /* ordered list */
        if (/^\d+[.)]\s/m.test(t)) {
          const items = t.split('\n').filter(Boolean)
            .map(l => `<li>${inlineFormat(l.replace(/^\d+[.)]\s/, ''))}</li>`)
            .join('');
          return `<ol>${items}</ol>`;
        }

        /* paragraph */
        const lines = t.split('\n').map(inlineFormat);
        return `<p>${lines.join('<br>')}</p>`;
      })
      .join('');

    return html;
  }

  /* ── syntax highlighter ── */
  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function syntaxHighlight(code, lang) {
    const l = (lang || '').toLowerCase();

    // Tokenize line by line, build .code-lines table
    const lines = code.split('\n');
    let linesHtml = '';
    for (let i = 0; i < lines.length; i++) {
      const rawLine = lines[i];
      const highlighted = tokenizeLine(rawLine, l);
      linesHtml += `<div class="code-line"><span class="code-line-num">${i+1}</span><span class="code-line-content">${highlighted}</span></div>`;
    }
    return `<div class="code-lines">${linesHtml}</div>`;
  }

  function tokenizeLine(line, lang) {
    // JS/TS/JSX keywords
    const jsKw = /\b(const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|delete|typeof|instanceof|in|of|class|extends|super|import|export|default|from|async|await|try|catch|finally|throw|yield|static|get|set|this)\b/g;
    const jsBool = /\b(true|false|null|undefined|NaN|Infinity)\b/g;
    // Python keywords
    const pyKw = /\b(def|class|return|if|elif|else|for|while|in|not|and|or|import|from|as|with|try|except|finally|raise|pass|break|continue|lambda|yield|global|nonlocal|del|assert|is|True|False|None)\b/g;
    // Shared: strings, comments, numbers
    const dqStr = /"(?:[^"\\]|\\.)*"/g;
    const sqStr = /'(?:[^'\\]|\\.)*'/g;
    const btStr = /`(?:[^`\\]|\\.)*`/g;
    const lineComment = /\/\/.*/g;
    const hashComment = /#.*/g;
    const blockComment = /\/\*[\s\S]*?\*\//g;
    const numLit = /\b\d+(\.\d+)?\b/g;
    const fnCall = /\b([a-zA-Z_$][a-zA-Z0-9_$]*)(?=\s*\()/g;
    const clsName = /\b([A-Z][a-zA-Z0-9_]*)\b/g;
    const propKey = /([a-zA-Z_$][a-zA-Z0-9_$]*)(?=\s*:)/g;

    // We'll do a token-replacement approach on escaped text
    // Use placeholders to avoid double-processing
    const ph = [];
    function protect(html) {
      const i = ph.length;
      ph.push(html);
      return `\x01${i}\x01`;
    }

    let s = line; // raw, unescaped

    // 1. Block comments first
    s = s.replace(blockComment, m => protect(`<span class="tk-cmt">${esc(m)}</span>`));

    // 2. Line comments
    if (lang === 'python' || lang === 'py' || lang === 'bash' || lang === 'sh' || lang === 'yaml' || lang === 'yml') {
      s = s.replace(hashComment, m => protect(`<span class="tk-cmt">${esc(m)}</span>`));
    } else {
      s = s.replace(lineComment, m => protect(`<span class="tk-cmt">${esc(m)}</span>`));
    }

    // 3. Template literals
    s = s.replace(btStr, m => protect(`<span class="tk-str">${esc(m)}</span>`));
    // 4. Double-quoted strings
    s = s.replace(dqStr, m => protect(`<span class="tk-str">${esc(m)}</span>`));
    // 5. Single-quoted strings
    s = s.replace(sqStr, m => protect(`<span class="tk-str">${esc(m)}</span>`));

    // 6. Now escape remaining raw chars
    s = esc(s);

    // 7. Numbers
    s = s.replace(numLit, m => protect(`<span class="tk-num">${m}</span>`));

    // 8. Class names (CapitalCase)
    s = s.replace(clsName, (m, p1) => protect(`<span class="tk-cls">${p1}</span>`));

    // 9. Function calls
    s = s.replace(fnCall, (m, p1) => protect(`<span class="tk-fn">${p1}</span>`));

    // 10. Keywords
    if (lang === 'python' || lang === 'py') {
      s = s.replace(pyKw, m => protect(`<span class="tk-kw">${m}</span>`));
    } else {
      s = s.replace(jsKw, m => protect(`<span class="tk-kw">${m}</span>`));
    }

    // 11. Booleans/null
    s = s.replace(jsBool, m => protect(`<span class="tk-bool">${m}</span>`));

    // 12. Object keys (prop: )
    s = s.replace(propKey, (m, p1) => protect(`<span class="tk-prop">${p1}</span>`));

    // Restore placeholders
    s = s.replace(/\x01(\d+)\x01/g, (_, i) => ph[+i]);
    return s || ' ';
  }

  /* ── copy button — delegated, no inline JS ── */
  document.addEventListener('click', function(e) {
    const btn = e.target.closest('.code-copy-btn');
    if (!btn) return;
    const blockId = btn.getAttribute('data-target');
    const block = document.getElementById(blockId);
    if (!block) return;
    // Get raw text from all .code-line-content spans
    const contentSpans = block.querySelectorAll('.code-line-content');
    let rawCode = '';
    contentSpans.forEach((span, i) => {
      rawCode += (i > 0 ? '\n' : '') + span.innerText;
    });
    // Fallback to pre innerText
    if (!rawCode) rawCode = block.querySelector('pre')?.innerText || '';
    navigator.clipboard.writeText(rawCode).then(() => {
      btn.classList.add('copied');
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copied`;
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`;
      }, 1800);
    }).catch(() => {});
  });

  function addMsg(role, text) {
    const d    = document.createElement('div');
    d.className = `msg ${role}`;
    const html  = role === 'bot'
      ? renderMarkdown(text)
      : text.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    d.innerHTML = `<div class="bubble">${html}</div>`;
    msgWrap.appendChild(d);
    if (role === 'bot') appendBotActions(d, text);
    if (role === 'user') {
      _lastUserMsgEl = d;
      scrollToMsg(d);
    }
  }

  function appendBotActions(msgEl, fullText) {
    const bar = document.createElement('div');
    bar.className = 'bot-actions';
    const actions = [
      { key: 'copy',    label: 'Copy',    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>` },
      { key: 'retry',   label: 'Retry',   svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>` },
      { key: 'like',    label: 'Like',    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/><path d="M7 10v12"/></svg>` },
      { key: 'dislike', label: 'Dislike', svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg>` },
      { key: 'refresh', label: 'Refresh', svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6"/><path d="M2.5 12a10 10 0 0 1 17.8-6.3L21.5 8"/><path d="M2.5 22v-6h6"/><path d="M21.5 12a10 10 0 0 1-17.8 6.3L2.5 16"/></svg>` },
    ];
    const btnRefs = {};
    actions.forEach(({ key, label, svg }) => {
      const btn = document.createElement('button');
      btn.setAttribute('aria-label', label);
      btn.innerHTML = svg;
      btnRefs[key] = btn;
      bar.appendChild(btn);
    });
    Object.entries(btnRefs).forEach(([key, btn]) => {
      btn.addEventListener('click', () => {
        if (key === 'copy') {
          navigator.clipboard.writeText(msgEl.querySelector('.bubble')?.innerText || fullText).catch(() => {});
          btn.style.color = '#2da44e';
          setTimeout(() => btn.style.color = '', 1200);
        } else if (key === 'like') {
          btn.classList.toggle('active-like');
          btnRefs['dislike']?.classList.remove('active-dislike');
        } else if (key === 'dislike') {
          btn.classList.toggle('active-dislike');
          btnRefs['like']?.classList.remove('active-like');
        } else if (key === 'refresh' || key === 'retry') {
          btn.style.transition = 'transform 0.45s ease';
          btn.style.transform  = 'rotate(360deg)';
          setTimeout(() => { btn.style.transform = ''; btn.style.transition = ''; }, 500);
        }
      });
    });
    msgEl.appendChild(bar);
  }

  let typingEl = null;
  function showTyping() {
    typingEl = document.createElement('div');
    typingEl.className = 'msg bot';
    typingEl.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span><span></span></div>`;
    msgWrap.appendChild(typingEl);
  }
  function removeTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

  /* ── keyboard / viewport positioning ── */
  const chatbarWrap = document.querySelector('.chatbar-wrap');
  const chatSpacer  = document.getElementById('chatSpacer');

  let _vvpRafId     = 0;
  let _cleanupRafId = 0;
  let _prevOffset   = -1;

  let _lastSpacerH = -1;
  function updateSpacer(kbHeight) {
    const barH    = chatbarWrap.offsetHeight;
    const spacerH = barH + (kbHeight || 0);
    if (spacerH === _lastSpacerH) return;
    _lastSpacerH = spacerH;
    chatSpacer.style.height = spacerH + 'px';
  }

  const _barResizeObserver = new ResizeObserver(() => {
    updateSpacer(_keyboardOpen ? Math.max(0, window.innerHeight - window.visualViewport?.height - window.visualViewport?.offsetTop) : 0);
  });
  _barResizeObserver.observe(chatbarWrap);

  function fixViewport() {
    if (_vvpRafId) return;
    _vvpRafId = requestAnimationFrame(_applyViewport);
  }

  function _applyViewport() {
    _vvpRafId = 0;
    const vvp = window.visualViewport;
    if (!vvp) return;
    const kbHeight = Math.max(0, window.innerHeight - vvp.height - vvp.offsetTop);
    if (Math.round(kbHeight) === Math.round(_prevOffset)) return;
    const wasOpen   = _keyboardOpen;
    _keyboardOpen   = kbHeight > 50;
    _prevOffset     = kbHeight;
    viewportResizing = true;
    if (_keyboardOpen && !wasOpen) {
      chatbarWrap.style.transition = 'none';
    } else if (!_keyboardOpen && wasOpen) {
      chatbarWrap.style.transition = 'transform 0.28s cubic-bezier(0.0, 0.0, 0.2, 1)';
    }
    chatbarWrap.style.transform = kbHeight > 0
      ? `translateY(-${kbHeight}px) translateZ(0)` : '';
    updateSpacer(kbHeight);
    if (kbHeight > 0) {
      _programmaticScroll = true;
      if (_lastUserMsgEl) {
        const GAP = 16;
        scrollHost.scrollTop = Math.max(0, _lastUserMsgEl.offsetTop - GAP);
      } else {
        scrollHost.scrollTop = scrollHost.scrollHeight;
      }
      _pinnedToBottom = (scrollHost.scrollTop + scrollHost.clientHeight) >= (scrollHost.scrollHeight - 8);
    }
    cancelAnimationFrame(_cleanupRafId);
    _cleanupRafId = requestAnimationFrame(() => {
      _cleanupRafId = requestAnimationFrame(() => {
        _cleanupRafId = 0;
        lastScrollY = scrollHost.scrollTop;
        accumDown   = 0; accumUp = 0;
        viewportResizing    = false;
        _programmaticScroll = false;
      });
    });
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fixViewport, { passive: true });
    window.visualViewport.addEventListener('scroll', fixViewport, { passive: true });
    updateSpacer(0);
    _applyViewport();
  } else {
    function _legacyFix() {
      const h = window.innerHeight + 'px';
      if (document.body.style.height !== h) document.body.style.height = h;
    }
    window.addEventListener('resize', _legacyFix, { passive: true });
    _legacyFix();
    updateSpacer(0);
  }

  /* ── URL param auto-send ── */
  const q = new URLSearchParams(location.search).get('q');
  if (q) { input.value = q; pill.classList.add('has-text'); send(); }

  /* ── sticky header ── */
  const HIDE_ACCUM  = 40;
  const SHOW_ACCUM  = 55;
  const LOGO_THRESH = 10;

  function updateHeader() {
    rafPending = false;
    if (viewportResizing || _programmaticScroll) {
      lastScrollY = scrollHost.scrollTop;
      accumDown = 0; accumUp = 0;
      return;
    }
    const sy    = scrollHost.scrollTop;
    const delta = sy - lastScrollY;
    if (delta === 0) return;
    lastScrollY = sy;
    if (sy <= LOGO_THRESH) {
      accumDown = 0; accumUp = 0;
      if (isLogoCollapsed) { logoHeader.classList.remove('collapsed'); isLogoCollapsed = false; }
      if (isTabHidden)     { tabBar.classList.remove('hide');          isTabHidden      = false; }
      if (isTabScrolled)   { tabBar.classList.remove('scrolled');      isTabScrolled    = false; }
      return;
    }
    if (!isLogoCollapsed) { logoHeader.classList.add('collapsed'); isLogoCollapsed = true; }
    if (!isTabScrolled)   { tabBar.classList.add('scrolled');      isTabScrolled    = true; }
    if (delta > 0) {
      accumDown += delta;
      if (accumUp > 0) accumUp = 0;
      if (!isTabHidden && accumDown >= HIDE_ACCUM) {
        tabBar.classList.add('hide'); isTabHidden = true; accumDown = 0;
      }
    } else {
      accumUp += -delta;
      if (accumDown > 0) accumDown = 0;
      if (isTabHidden && accumUp >= SHOW_ACCUM) {
        tabBar.classList.remove('hide'); isTabHidden = false; accumUp = 0;
      }
    }
  }

  scrollHost.addEventListener('scroll', () => {
    if (!rafPending) { rafPending = true; requestAnimationFrame(updateHeader); }
  }, { passive: true });

  /* ── plus menu ── */
  const plusBtn      = document.getElementById('plusBtn');
  const plusMenu     = document.getElementById('plusMenu');
  const plusBackdrop = document.getElementById('plusBackdrop');
  let _plusOpen = false;

  function openPlusMenu() {
    const rect = plusBtn.getBoundingClientRect();
    plusMenu.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
    _plusOpen = true;
    plusBackdrop.classList.add('open');
    requestAnimationFrame(() => plusMenu.classList.add('open'));
  }
  function closePlusMenu() {
    _plusOpen = false;
    plusMenu.classList.remove('open');
    plusBackdrop.classList.remove('open');
  }

  plusBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    _plusOpen ? closePlusMenu() : openPlusMenu();
  });
  plusBackdrop.addEventListener('click', closePlusMenu);

  document.getElementById('pmPhoto').addEventListener('click',    () => { closePlusMenu(); });
  document.getElementById('pmCamera').addEventListener('click',   () => { closePlusMenu(); });
  document.getElementById('pmFile').addEventListener('click',     () => { closePlusMenu(); });
  document.getElementById('pmLocation').addEventListener('click', () => { closePlusMenu(); });

  const _allTabs = tabBar.querySelectorAll('.tab');
  tabBar.addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    _allTabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  }, { passive: true });
</script>
</body>
</html>
