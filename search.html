<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Atkyn</title>
  
  <!-- SEO & PWA Meta Tags -->
  <meta name="description" content="Atkyn - AI-powered search and assistant">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Preconnect for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>

  <!-- JetBrains Mono (Single Instance - Dead Code Removed) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap">

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" defer crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" defer crossorigin="anonymous"></script>

  <!-- Highlight.js (Atom One Light/Dark per OS preference) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-light.min.css" media="(prefers-color-scheme: light)" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css" media="(prefers-color-scheme: dark)" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js" defer crossorigin="anonymous"></script>

  <!-- Marked.js + Marked KaTeX Extension -->
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js" defer crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.0.1/lib/index.umd.js" defer crossorigin="anonymous"></script>

  <!-- Lightweight Charts -->
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" defer crossorigin="anonymous"></script>

  <!-- App Styles (Note: Fixed potential 'search.css/search.css' typo to 'css/search.css') -->
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/code-block.css">
  <link rel="stylesheet" href="css/stock-card.css">
</head>
<body>

  <div class="scroll-host" id="scrollHost">

    <header class="logo-header">
      <button class="dots-btn" type="button" aria-label="Options">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </button>
      <img src="Logo.png" alt="Atkyn Logo" fetchpriority="high" decoding="async" width="120" height="40" />
      <button class="hamburger-btn" type="button" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </header>

    <nav class="tab-bar" id="tabBar" role="tablist" aria-label="Search Categories">
      <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="ai">Answer</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="web">Web</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="images">Images</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="videos">Videos</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="news">News</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="maps">Maps</button>
    </nav>

    <main class="chat-area" id="chatArea">
      <div class="msg-wrap" id="msgWrap" aria-live="polite"></div>
      <div id="chatSpacer"></div>
    </main>

    <!-- Kept for JS routing/state management -->
    <div id="pageContent" hidden aria-hidden="true"></div>

  </div>

  <div class="plus-menu-backdrop" id="plusBackdrop" aria-hidden="true"></div>

  <div class="plus-menu" id="plusMenu" role="dialog" aria-label="Attachment Options">
    <button class="pm-item" type="button" id="pmPhoto">
      <span class="pm-icon pm-icon-photo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </span>
      Photo Library
    </button>
    <button class="pm-item" type="button" id="pmCamera">
      <span class="pm-icon pm-icon-camera" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </span>
      Camera
    </button>
    <button class="pm-item" type="button" id="pmFile">
      <span class="pm-icon pm-icon-file" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
      </span>
      Upload File
    </button>
    <button class="pm-item" type="button" id="pmLocation">
      <span class="pm-icon pm-icon-location" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </span>
      Location
    </button>
  </div>

  <footer class="chatbar-wrap">
    <div class="overlay-pill" id="pill">
      <button class="ico-plus" type="button" id="plusBtn" aria-label="Add attachment">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
      
      <div class="overlay-input-wrap">
        <input 
          class="search-input" 
          type="search" 
          id="cbInput" 
          placeholder=" "
          autocomplete="off" 
          autocorrect="off" 
          autocapitalize="off" 
          spellcheck="false"
          enterkeyhint="search"
          aria-label="Search input"
        />
        <div class="shimmer-overlay" aria-hidden="true"><span>Ask Atkyn</span></div>
      </div>
      
      <button class="ico-camera" type="button" aria-label="Visual search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
      
      <button class="send-btn" type="button" id="sendBtn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="20" x2="12" y2="4"/>
          <polyline points="5 11 12 4 19 11"/>
        </svg>
      </button>
    </div>
  </footer>

  <!-- App Scripts (Deferred for non-blocking execution) -->
  <script src="renderer.js" defer></script>
  <script src="core.js" defer></script>
  <script src="search.js" defer></script>

</body>
</html>
